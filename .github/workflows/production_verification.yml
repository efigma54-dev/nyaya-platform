name: Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyaya_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: nyaya_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
          - 6334:6334
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests psutil
      
      - name: Build Docker images
        run: |
          docker compose build
      
      - name: Start services
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
      
      - name: Check service health
        run: |
          docker compose ps
          docker compose logs
        if: always()
      
      - name: Run production verification
        run: |
          python backend/scripts/verification/verify_all.py
        env:
          DATABASE_URL: postgresql://nyaya_user:testpass@localhost:5432/nyaya_db
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
      
      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: verification-evidence
          path: evidence/runtime/
      
      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'evidence/runtime/production_acceptance.md';
            if (fs.existsSync(reportPath)) {
              const content = fs.readFileSync(reportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Production Verification Report\n\n' + content
              });
            }
      
      - name: Stop services
        if: always()
        run: docker compose down
